<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ari and the Fireflies</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}
#ui {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  font-family: 'Courier New', monospace;
  color: #ffe8a0;
  font-size: 20px;
  text-shadow: 0 0 8px rgba(0,0,0,0.8);
}
#message {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Courier New', monospace;
  color: #ffe8a0;
  font-size: 28px;
  text-shadow: 0 0 12px rgba(0,0,0,0.9);
  pointer-events: none;
  display: none;
  text-align: center;
}
#fps {
  position: absolute;
  left: 24px;
  bottom: 16px;
  pointer-events: none;
  font-family: 'Courier New', monospace;
  color: #ffe8a0;
  font-size: 18px;
  text-shadow: 0 0 8px rgba(0,0,0,0.8);
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <span id="score">Score: 0</span>
  <span id="health">Health: 100</span>
  <span id="timer">2:00</span>
</div>
<div id="message"></div>
<div id="fps">FPS: --</div>
<script type="module">
import { createEngine, loadLevel, attachGameSession, startFrameLoop } from './src/engine.js';
import { loadLevel as loadLevelData, defaultLevel } from './src/levels.js';

async function main() {
  const canvas = /** @type {HTMLCanvasElement} */ (document.getElementById('canvas'));
  const messageEl = /** @type {HTMLElement} */ (document.getElementById('message'));

  const params = new URLSearchParams(window.location.search);
  const levelId = params.get('level') || 'level0';

  let levelData;
  try {
    levelData = await loadLevelData(levelId);
  } catch (e) {
    console.warn(`Failed to load level ${levelId}, using defaults:`, e);
    levelData = defaultLevel();
  }

  const engine = await createEngine(canvas);
  if (!engine) {
    messageEl.style.display = 'block';
    messageEl.textContent = 'WebGPU is not supported in this browser.';
    return;
  }

  loadLevel(engine, levelData);
  attachGameSession(engine, { duration: levelData.config.game.duration });
  console.log(`Level "${levelData.config.name}" loaded (${levelId})`);
  startFrameLoop(engine);
}

main();
</script>
</body>
</html>
